<form class="search">
  <label class="search__label" for="movie-search">Пошук фільмів</label>
  <input
    class="search__input"
    name="search-query"
    type="search"
    placeholder="Пошук фільма..."
    maxlength="250"
  />

  <span class="search__icon">
    <load src="src/html-components/icons/search-icon.html" />
